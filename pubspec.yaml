name: tally
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  provider: ^6.1.5
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  uuid: ^4.5.3
  google_fonts: ^6.2.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  crop_your_image: ^2.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.1.1
  font_awesome_flutter: ^11.0.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF7F0"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"